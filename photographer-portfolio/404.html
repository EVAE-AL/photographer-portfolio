<base id="baseHref" href="/photographer-portfolio/" />
<script>
(function () {
  var segs = location.pathname.split('/').filter(Boolean);
  document.getElementById('baseHref').href = segs[0] === 'photographer-portfolio' ? '/photographer-portfolio/' : '/';
  document.addEventListener('click', function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    if (!a) return;
    ev.preventDefault();
    var target = document.getElementById(a.getAttribute('href').slice(1));
    if (target) { target.scrollIntoView({ behavior: 'smooth' }); } else { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
})();
</script>
