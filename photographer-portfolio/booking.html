<main id="top">
  <section class="page-head"><div class="container"><span class="eyebrow">Booking</span><h1>预约拍摄</h1><p class="page-head-desc">花一分钟填写关键信息。我会根据你的时间、地点和拍摄目的给出具体建议与报价。</p></div></section>
  <section class="section section--tight"><div class="container"><div class="contact">
    <div class="reveal"><div class="contact-row"><div><span>拍摄前</span><strong>先确认档期与方案</strong></div></div><div class="contact-row"><div><span>提交后</span><strong>调用本机邮件客户端</strong></div></div><div class="contact-row"><div><span>回复时间</span><strong>工作日 24 小时内</strong></div></div><div class="section-more"><a class="note" href="contact.html">想直接联系？查看联系方式 →</a></div></div>
    <form id="bookingForm" novalidate class="reveal">
      <div class="form-row"><div class="field"><label for="fName">称呼</label><input id="fName" name="name" type="text" maxlength="40" autocomplete="name" placeholder="怎么称呼你" /></div><div class="field"><label for="fContact">联系方式</label><input id="fContact" name="contact" type="text" maxlength="120" autocomplete="email" placeholder="邮箱或微信" /></div></div>
      <div class="form-row"><div class="field"><label id="fTypeLabel">拍摄类型</label><div class="select-box" id="typeSelect"><button class="select-trigger" id="typeTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="fTypeLabel"><span id="typeValue">个人写真</span><svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><ul class="select-menu" id="typeMenu" role="listbox" aria-labelledby="fTypeLabel"><li class="select-option" role="option" data-value="个人写真" aria-selected="true"><span>个人写真</span><svg class="select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg></li><li class="select-option" role="option" data-value="商业拍摄" aria-selected="false"><span>商业拍摄</span><svg class="select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg></li><li class="select-option" role="option" data-value="旅拍随行" aria-selected="false"><span>旅拍随行</span><svg class="select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg></li><li class="select-option" role="option" data-value="活动现场" aria-selected="false"><span>活动现场</span><svg class="select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg></li><li class="select-option" role="option" data-value="其他" aria-selected="false"><span>其他</span><svg class="select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg></li></ul><input type="hidden" name="type" value="个人写真" /></div></div><div class="field"><label for="fDate">期望日期</label><input id="fDate" name="date" type="date" /></div></div>
      <div class="field"><label for="fCity">拍摄城市</label><input id="fCity" name="city" type="text" maxlength="80" autocomplete="address-level2" placeholder="例如：杭州 / 成都" /></div>
      <div class="field"><label for="fMsg">需求描述</label><textarea id="fMsg" name="message" maxlength="1000" placeholder="拍摄用途、人数、参考风格、预算范围等"></textarea></div>
      <button class="btn-pill booking-submit" type="submit">发送预约信息</button><p class="form-note" id="formNote">提交后会调用本机邮件客户端发送；信息不会保存到网站。</p>
    </form>
  </div></div></section>
