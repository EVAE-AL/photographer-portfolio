    <button class="nav-toggle" id="navToggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="mobilePanel">

</header>

<!-- ==================== 页头 ==================== -->
<section class="page-head" id="top">
  <div class="container">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      返回首页
    </a>
    <span class="eyebrow">Selected Works</span>
    <h1>作品选集</h1>
    <p class="page-head-desc">按题材筛选查看。点击任意图片进入全屏，全屏状态下用方向键切换，Esc 关闭。</p>
    <div class="page-head-meta">
      <span id="count">12 张作品</span>
      <span>人像 · 风光 · 城市 · 纪实</span>
      <span>2015 — 至今</span>
    </div>
  </div>
</section>

<!-- ==================== 作品列表 ==================== -->
<section class="section section--tight">
  <div class="container">
    <div class="filters" id="filters" role="group" aria-label="作品分类筛选"></div>
    <div class="gallery" id="gallery"></div>
  </div>
</section>

<footer>
  <div class="container foot-inner">
    <span>© <span id="year"></span> 沈砚摄影 · SHEN YAN PHOTOGRAPHY</span>
    <div class="social">
      <a href="mailto:hello@shenyan.photo" aria-label="发送邮件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
      </a>
      <a href="#top" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </a>
    </div>
  </div>
</footer>

<!-- ==================== 灯箱 ==================== -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="作品查看">
  <div class="lb-stage">
    <div class="lb-frame">
      <button class="lb-icon lb-close" id="lbClose" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <img id="lbImage" src="" alt="" />
    </div>
    <div class="lb-bar">
      <div>
        <h3 id="lbTitle">—</h3>
        <small id="lbMeta">—</small>
      </div>
      <div class="lb-nav">
        <span class="lb-counter" id="lbCounter">1 / 1</span>
        <button class="lb-icon" id="lbPrev" type="button" aria-label="上一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="lb-icon" id="lbNext" type="button" aria-label="下一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="assets/photos.js"></script>
<script src="assets/site.js"></script>
<script src="assets/page.js"></script>
